# Nyomda - nginx reverse proxy konfig, rate limittel és méretkorláttal.
#
# Telepítés:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nyomda
#   # cseréld le a server_name-et a saját domainedre
#   sudo ln -s /etc/nginx/sites-available/nyomda /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS-hez (miután a domain DNS-e a VPS-re mutat):
#   sudo certbot --nginx -d your-domain.example

# Rate limit zónák: kliens IP-nként (X-Forwarded-For / Cloudflare mögött is
# helyesen működik, ha a valós_ip modul be van állítva a Cloudflare IP-kre).
# Az /api/resize szigorúbb, mert az a CPU/memória-igényes végpont.
limit_req_zone $binary_remote_addr zone=nyomda_resize:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=nyomda_general:10m rate=60r/m;

# Egyszerre futó kapcsolatok korlátozása IP-nként (lassú/sok párhuzamos
# feltöltés elleni védelem).
limit_conn_zone $binary_remote_addr zone=nyomda_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # A multer korlátja 30 MB; itt egy kicsit nagyobbra vesszük a
    # multipart overhead miatt, hogy pontosan a szerver saját hibaüzenete
    # fusson le, ne az nginxé.
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;

    location /api/resize {
        limit_req zone=nyomda_resize burst=3 nodelay;
        limit_conn nyomda_conn 4;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=nyomda_general burst=20 nodelay;
        limit_conn nyomda_conn 10;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
