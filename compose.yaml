services:
  nyomda:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/nyomda:latest
    container_name: nyomda
    ports:
      - "127.0.0.1:8085:8085"
    restart: unless-stopped
    environment:
      # A libvips (sharp) szálpoolja alapból a gép összes CPU magját
      # lefoglalná; korlátozzuk, hogy egy nagy kép ne vigye el az összes CPU-t.
      - VIPS_CONCURRENCY=2
    # Erőforráskorlátok, hogy egy visszaélésszerű terhelés (sok/nagy kép
    # egyidejű átméretezése) ne tudja lehúzni a teljes VPS-t. Igazítsd
    # a szerver tényleges kapacitásához.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 100
